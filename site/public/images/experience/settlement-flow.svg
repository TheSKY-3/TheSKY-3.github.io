<svg width="1240" height="340" viewBox="0 0 1240 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C97B4"/>
    </marker>
    <marker id="arwAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0650A"/>
    </marker>
  </defs>

  <rect width="1240" height="300" rx="14" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="1.2"/>
  <rect x="36" y="30" width="5" height="24" rx="2.5" fill="#A0650A"/>
  <text x="52" y="49" fill="#17233A" font-size="19" font-weight="600">财务对账工作流 · 司机 / 车企 / 平台 三方资金结算</text>
  <text x="1204" y="47" text-anchor="end" fill="#8296AC" font-size="13.5" font-family="Cascadia Code, Consolas, monospace">基于三方结算链路与字段口径梳理</text>

  <g>
    <rect x="36" y="92" width="146" height="64" rx="10" fill="#F6F8FB" stroke="#D8E0EA" stroke-width="1.4"/>
    <text x="109" y="118" text-anchor="middle" fill="#17233A" font-size="15.5" font-weight="600">订单完成</text>
    <text x="109" y="140" text-anchor="middle" fill="#5E7A99" font-size="12.5">司机钱包入账</text>

    <rect x="212" y="92" width="146" height="64" rx="10" fill="#F6F8FB" stroke="#D8E0EA" stroke-width="1.4"/>
    <text x="285" y="118" text-anchor="middle" fill="#17233A" font-size="15.5" font-weight="600">车租抵扣</text>
    <text x="285" y="140" text-anchor="middle" fill="#5E7A99" font-size="12.5">车企侧 · 承包租金</text>

    <rect x="388" y="92" width="146" height="64" rx="10" fill="#F6F8FB" stroke="#D8E0EA" stroke-width="1.4"/>
    <text x="461" y="118" text-anchor="middle" fill="#17233A" font-size="15.5" font-weight="600">双侧平台抽佣</text>
    <text x="461" y="140" text-anchor="middle" fill="#5E7A99" font-size="12.5">司机端 + 乘客端</text>

    <rect x="564" y="92" width="146" height="64" rx="10" fill="#F6F8FB" stroke="#D8E0EA" stroke-width="1.4"/>
    <text x="637" y="118" text-anchor="middle" fill="#17233A" font-size="15.5" font-weight="600">路桥费回补</text>
    <text x="637" y="140" text-anchor="middle" fill="#5E7A99" font-size="12.5">代收代付核对</text>

    <rect x="740" y="92" width="146" height="64" rx="10" fill="#F6F8FB" stroke="#D8E0EA" stroke-width="1.4"/>
    <text x="813" y="118" text-anchor="middle" fill="#17233A" font-size="15.5" font-weight="600">同日 / 跨日调账</text>
    <text x="813" y="140" text-anchor="middle" fill="#5E7A99" font-size="12.5">边界规则判定</text>

    <rect x="916" y="84" width="150" height="80" rx="10" fill="#FDF6EA" stroke="#A0650A" stroke-opacity="0.6" stroke-width="1.6"/>
    <text x="991" y="112" text-anchor="middle" fill="#A0650A" font-size="15.5" font-weight="600">21 项标准字段</text>
    <text x="991" y="132" text-anchor="middle" fill="#2E3A4C" font-size="12.5">统一结算口径</text>
    <text x="991" y="150" text-anchor="middle" fill="#A0650A" font-size="12" font-weight="600">+ 边界规则 · 验证案例</text>

    <rect x="1096" y="92" width="108" height="64" rx="10" fill="#F6F8FB" stroke="#D8E0EA" stroke-width="1.4"/>
    <text x="1150" y="118" text-anchor="middle" fill="#17233A" font-size="15.5" font-weight="600">复核 · 追溯</text>
    <text x="1150" y="140" text-anchor="middle" fill="#5E7A99" font-size="12.5">业务 + 审计</text>
  </g>

  <line x1="182" y1="124" x2="208" y2="124" stroke="#7C97B4" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="358" y1="124" x2="384" y2="124" stroke="#7C97B4" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="534" y1="124" x2="560" y2="124" stroke="#7C97B4" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="710" y1="124" x2="736" y2="124" stroke="#7C97B4" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="886" y1="124" x2="912" y2="124" stroke="#A0650A" stroke-width="2.2" marker-end="url(#arwAmber)"/>
  <line x1="1066" y1="124" x2="1092" y2="124" stroke="#A0650A" stroke-width="2.2" marker-end="url(#arwAmber)"/>

  <line x1="36" y1="196" x2="1204" y2="196" stroke="#D8E0EA" stroke-width="1"/>
  <text x="36" y="224" fill="#2E3A4C" font-size="14.5">为什么这么做：结算纠纷几乎都出在「边界」——跨日订单算哪天、中途取消抽不抽佣、回补金额谁承担。先把边界规则写清楚，再谈系统实现。</text>

  <rect x="36" y="240" width="1168" height="56" rx="10" fill="#FDF6EA" stroke="#A0650A" stroke-opacity="0.45" stroke-width="1.4"/>
  <text x="56" y="264" fill="#A0650A" font-size="14.5" font-weight="600">已自动化 · ruqi-reconciliation Skill + 本地程序</text>
  <text x="56" y="286" fill="#2E3A4C" font-size="13.5">输入双方结算 xlsx → 自动匹配、填列并生成或更新对账表；部门财务实测：单月对账约 1 天 → 约 10 分钟</text>

  <text x="36" y="322" fill="#8296AC" font-size="13">注：图中为口径梳理成果的抽象表达，不含真实金额、匹配行数与账户信息；历史月份支持一键核验，重复键 / 缺字段自动中止、不写坏源文件。</text>
</svg>
